name: Generate contribution snake

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate light and dark SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%238B5CF6
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23A78BFA

      - name: Verify generated animation files
        shell: bash
        run: |
          set -euo pipefail
          for file in dist/github-contribution-grid-snake.svg dist/github-contribution-grid-snake-dark.svg; do
            test -s "$file"
            grep -q '<svg' "$file"
            grep -q '@keyframes' "$file"
            echo "Validated $file ($(wc -c < "$file") bytes)"
          done

      - name: Publish SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
