name: Generate contribution snake

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate light and dark animations
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23c65316&color_dots=%23ebedf0,%23f6dcc7,%23eeb68a,%23d98448,%23a95220
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23ffad66&color_dots=%23161b22,%23392b20,%2365482d,%239e6737,%23d89a57

      - name: Verify animated SVG outputs
        shell: bash
        run: |
          set -euo pipefail
          for file in dist/github-contribution-grid-snake.svg dist/github-contribution-grid-snake-dark.svg; do
            test -s "$file"
            grep -Fq '<svg' "$file"
            grep -Fq '@keyframes s0' "$file"
            if grep -Fq '.c{animation:none!important}' "$file"; then
              echo "::error::Contribution-cell animation is disabled in $file"
              exit 1
            fi
            python3 -c 'import sys, xml.etree.ElementTree as ET; ET.parse(sys.argv[1])' "$file"
            echo "Validated $file ($(wc -c < "$file") bytes)"
          done

      - name: Publish SVGs to output branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
