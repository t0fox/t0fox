<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#09090F"/>
      <stop offset="0.52" stop-color="#0C0A14"/>
      <stop offset="1" stop-color="#090D12"/>
    </linearGradient>
    <linearGradient id="accent" x1="340" y1="0" x2="860" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6"/>
      <stop offset="0.52" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" stroke="#A78BFA" stroke-opacity="0.075" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <clipPath id="r1"><rect x="185" y="260" width="0" height="28"><animate attributeName="width" from="0" to="830" dur="1.25s" begin="0.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="r2"><rect x="185" y="295" width="0" height="28"><animate attributeName="width" from="0" to="830" dur="1.25s" begin="1.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="r3"><rect x="185" y="330" width="0" height="28"><animate attributeName="width" from="0" to="830" dur="1.25s" begin="2.8s" fill="freeze"/></rect></clipPath>
  </defs>

  <rect x="1" y="1" width="1198" height="418" rx="28" fill="url(#bg)" stroke="#272235" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="416" rx="27" fill="url(#grid)"/>

  <circle cx="195" cy="88" r="105" fill="#8B5CF6" fill-opacity="0.12" filter="url(#soft)">
    <animate attributeName="r" values="90;125;90" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1040" cy="310" r="115" fill="#22D3EE" fill-opacity="0.08" filter="url(#soft)">
    <animate attributeName="r" values="120;92;120" dur="9s" repeatCount="indefinite"/>
  </circle>

  <path d="M70 120C235 70 320 92 440 142S720 220 1130 96" stroke="#8B5CF6" stroke-opacity="0.18" stroke-width="1.5"/>
  <path d="M80 355C310 330 360 180 600 206S860 355 1120 284" stroke="#22D3EE" stroke-opacity="0.14" stroke-width="1.5"/>

  <circle r="4.5" fill="#A78BFA" filter="url(#glow)">
    <animateMotion dur="6.2s" repeatCount="indefinite" path="M70 120C235 70 320 92 440 142S720 220 1130 96"/>
  </circle>
  <circle r="4" fill="#22D3EE" filter="url(#glow)">
    <animateMotion dur="7.4s" begin="-2.6s" repeatCount="indefinite" path="M80 355C310 330 360 180 600 206S860 355 1120 284"/>
  </circle>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="600" y="112" text-anchor="middle" font-size="66" font-weight="800" letter-spacing="3" fill="#F5F3FF">t0fox</text>
    <rect x="390" y="129" width="420" height="3" rx="1.5" fill="url(#accent)" filter="url(#glow)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="600" y="166" text-anchor="middle" font-size="18" letter-spacing="5" fill="#9F95B5">SYSTEMS / NETWORKING / DEVOPS</text>
  </g>

  <g>
    <rect x="150" y="205" width="900" height="174" rx="18" fill="#0D0C14" fill-opacity="0.92" stroke="#2E2740"/>
    <rect x="150" y="205" width="900" height="38" rx="18" fill="#13111D"/>
    <path d="M150 225C150 213.954 158.954 205 170 205H1030C1041.05 205 1050 213.954 1050 225V243H150V225Z" fill="#13111D"/>
    <circle cx="176" cy="224" r="5" fill="#FF6B7A"/>
    <circle cx="194" cy="224" r="5" fill="#F5C451"/>
    <circle cx="212" cy="224" r="5" fill="#54D38A"/>
    <text x="600" y="230" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#746D83">t0fox@github — bash</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18">
    <text x="185" y="280" fill="#A78BFA" clip-path="url(#r1)"><tspan fill="#6EE7F2">❯</tspan> boot profile --mode=infra</text>
    <text x="185" y="315" fill="#D7D2E2" clip-path="url(#r2)"><tspan fill="#71717A">[ok]</tspan> linux · docker · openwrt · ci/cd · rust</text>
    <text x="185" y="350" fill="#D7D2E2" clip-path="url(#r3)"><tspan fill="#71717A">[ok]</tspan> building resilient systems and sharp tooling</text>

    <text x="185" y="350" fill="#22D3EE" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.55;0.56;0.82;1" dur="5s" repeatCount="indefinite"/>
    </text>
    <rect x="744" y="334" width="10" height="21" rx="1" fill="#A78BFA">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.48;0.49;1" dur="0.9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="0" y="0" width="1200" height="2" fill="url(#line)" opacity="0">
    <animate attributeName="y" values="35;385" dur="5.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.55;0" dur="5.8s" repeatCount="indefinite"/>
  </rect>
</svg>