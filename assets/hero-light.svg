<svg width="1200" height="390" viewBox="0 0 1200 390" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .name{font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.2px}
    .display{font:700 54px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-2px}
    .subtitle{font:500 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .body{font:400 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .mono{font:500 13px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
    .cursor{animation:blink 1.1s step-end infinite}
    @keyframes blink{0%,48%{opacity:1}49%,100%{opacity:0}}
    @media (prefers-reduced-motion: reduce){.cursor{animation:none}}
  </style>

  <rect x="1" y="1" width="1198" height="388" rx="30" fill="#F7F7F9" stroke="#D9D9DF" stroke-width="2"/>

  <g transform="translate(60 44)">
    <circle cx="5" cy="5" r="5" fill="#6E5AE6"/>
    <text x="20" y="10" class="name" fill="#6E6E73">Kirill / t0fox</text>
  </g>

  <g transform="translate(62 94)">
    <text x="0" y="52" class="display" fill="#1D1D1F">DevOps &amp; Systems</text>
    <text x="0" y="111" class="display" fill="#1D1D1F">Engineer</text>
    <text x="2" y="158" class="subtitle" fill="#6E6E73">Linux · OpenWrt · Docker · Networking · CI/CD</text>
    <text x="2" y="202" class="body" fill="#6E6E73">Building infrastructure and networking tools that are observable,</text>
    <text x="2" y="227" class="body" fill="#6E6E73">reproducible, and straightforward to operate.</text>
  </g>

  <g transform="translate(760 70)">
    <rect x="0" y="0" width="380" height="255" rx="22" fill="#FFFFFF" stroke="#D9D9DF"/>
    <rect x="0" y="0" width="380" height="42" rx="22" fill="#EFEFF2"/>
    <path d="M0 22C0 9.85 9.85 0 22 0H358C370.15 0 380 9.85 380 22V42H0V22Z" fill="#EFEFF2"/>
    <circle cx="22" cy="21" r="5" fill="#FF5F57"/>
    <circle cx="40" cy="21" r="5" fill="#FEBC2E"/>
    <circle cx="58" cy="21" r="5" fill="#28C840"/>
    <text x="190" y="26" class="mono" fill="#8E8E93" text-anchor="middle">profile.sh</text>

    <text x="26" y="80" class="mono" fill="#8E8E93">$ focus</text>
    <text x="122" y="80" class="mono" fill="#1D1D1F">OpenWrt / networking</text>

    <text x="26" y="116" class="mono" fill="#8E8E93">$ build</text>
    <text x="122" y="116" class="mono" fill="#1D1D1F">containers / tooling</text>

    <text x="26" y="152" class="mono" fill="#8E8E93">$ ship</text>
    <text x="122" y="152" class="mono" fill="#1D1D1F">CI / reproducible tests</text>

    <line x1="26" y1="178" x2="354" y2="178" stroke="#D9D9DF"/>

    <circle cx="31" cy="212" r="5" fill="#248A3D"/>
    <text x="48" y="217" class="mono" fill="#6E6E73">status: building</text>
    <rect class="cursor" x="188" y="204" width="2" height="17" rx="1" fill="#6E5AE6"/>
  </g>
</svg>